<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KR4 CPU D-Cache 动画演示</title>

 <style>
  :root {
    --bg: #06111d;
    --panel: #0d2238;
    --panel2: #091a2b;
    --border: #315574;
    --text: #dcecff;
    --muted: #8da8bf;
    --blue: #68b7ff;
    --green: #60d394;
    --yellow: #ffd166;
    --red: #ef6f6c;
    --purple: #bb86fc;

    /* V0.2 统一字号阶梯：不再使用 8 / 9 / 10px */
    --fs-label: 12px;
    --fs-data: 14px;
    --fs-title: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--text);
    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(26, 74, 112, 0.28),
        transparent 42%
      ),
      var(--bg);
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }

  code,
  .mono {
    font-family: Consolas, "Courier New", monospace;
  }

  /* ================= Header ================= */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 8px 6px;
    border-bottom: 1px solid #294661;
    background: rgba(5, 16, 28, 0.97);
    backdrop-filter: blur(8px);
  }

  .header-main {
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-title {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    font-size: 21px;
  }

  .subtitle {
    color: var(--muted);
    font-size: var(--fs-label);
  }

  .header-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .badge,
  .header-link {
    min-height: 29px;
    padding: 5px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #b9dcff;
    font-size: var(--fs-label);
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0a1e31;
  }

  .header-link:hover {
    background: #17456d;
  }

  /* ============ 页面主容器：全宽流式（取消 1880px 封顶） ============ */
  main {
    width: calc(100% - 12px);
    margin: 6px auto 10px;
  }

  .panel {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: rgba(13, 34, 56, 0.93);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
  }

  .panel h2 {
    margin: 0 0 7px;
    color: var(--blue);
    font-size: var(--fs-title);
  }

  .panel h3 {
    margin: 8px 0 5px;
    color: #b9dcff;
    font-size: 14px;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  /* 同一行两个 panel 等高；子元素可纵向撑满（用于日志区） */
  .grid2 > .panel {
    display: flex;
    flex-direction: column;
  }

  .control-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(112px, max-content));
    justify-content: space-between;
    gap: 5px;
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 3px;
    color: var(--muted);
    font-size: var(--fs-label);
  }

  input,
  select,
  button {
    min-height: 30px;
    padding: 4px 8px;
    color: var(--text);
    font-size: var(--fs-label);
    border: 1px solid #39709e;
    border-radius: 6px;
    background: #071827;
  }

  button {
    cursor: pointer;
    font-weight: bold;
    background: #174a74;
  }

  button:hover {
    filter: brightness(1.18);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* V0.2 微调：控制区输入框不再无限拉伸 */
  .control-grid input,
  .control-grid select {
    width: 100%;
    max-width: 164px;
  }


  /* 关键：flex-end 防止按钮被拉伸成与"动画速度"标签同高 */
  .button-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 5px;
    margin-top: 6px;
  }

  .success-button {
    color: #062014;
    border-color: #54b87f;
    background: var(--green);
  }

  .warning-button {
    color: #261b00;
    border-color: #c99c2b;
    background: var(--yellow);
  }

  .danger-button {
    border-color: #b95757;
    background: #8a3838;
  }

  .status-bar {
    min-height: 30px;
    margin-top: 6px;
    padding: 6px 9px;
    display: flex;
    align-items: center;
    color: var(--yellow);
    font-size: var(--fs-label);
    border: 1px solid #315574;
    border-radius: 6px;
    background: #071827;
  }

  .progress-shell {
    height: 7px;
    margin-top: 6px;
    overflow: hidden;
    border: 1px solid #315574;
    border-radius: 5px;
    background: #06121e;
  }

  .progress-bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--blue));
    transition: width 0.2s;
  }

  /* ========= 运行统计：全站唯一一处定义，9 列 ========= */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(9, minmax(96px, max-content));
    justify-content: space-between;
    gap: 5px;
  }


  .stat {
    min-height: 48px;
    padding: 5px 4px;
    text-align: center;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #071827;
  }

  .stat small,
  .stat strong {
    display: block;
  }

  .stat small {
    margin-bottom: 4px;
    color: var(--muted);
    font-size: var(--fs-label);
    line-height: 1.2;
  }

  .stat strong {
    color: var(--yellow);
    font-family: Consolas, monospace;
    font-size: 16px;
    line-height: 1.2;
  }

  /* ================= 地址分解 ================= */
  .decode-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(104px, max-content));
    justify-content: space-between;
    gap: 4px;
  }


  .decode-item {
    min-height: 46px;
    padding: 5px 4px;
    text-align: center;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #071827;
  }

  .decode-item small,
  .decode-item strong {
    display: block;
  }

  .decode-item small {
    margin-bottom: 3px;
    color: var(--muted);
    font-size: var(--fs-label);
    line-height: 1.2;
  }

  .decode-item strong {
    color: #a9d9ff;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.2;
  }

  /* ================= 数据路径 ================= */
  .data-path {
    min-height: 148px;
    padding: 10px 6px;
    display: grid;
    grid-template-columns:
      minmax(110px, 1fr)
      34px
      minmax(120px, 1fr)
      34px
      minmax(140px, 1.15fr)
      34px
      minmax(140px, 1.15fr)
      34px
      minmax(130px, 1fr);
    align-items: center;
    gap: 4px;
  }

  .path-node {
    min-height: 86px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px solid #315574;
    border-radius: 10px;
    background: #071827;
    transition:
      transform 0.2s,
      box-shadow 0.2s,
      border-color 0.2s,
      background 0.2s;
  }

  .path-node strong {
    margin-bottom: 6px;
    color: #b9dcff;
    font-size: 15px;
  }

  .path-node span {
    color: var(--muted);
    font-size: var(--fs-label);
    line-height: 1.4;
  }

  .path-node.active {
    transform: translateY(-3px);
    border-color: var(--yellow);
    background: #4e4018;
    box-shadow: 0 0 18px rgba(255, 209, 102, 0.42);
  }

  .path-node.hit {
    border-color: var(--green);
    background: #164a33;
    box-shadow: 0 0 18px rgba(96, 211, 148, 0.42);
  }

  .path-node.miss {
    border-color: var(--red);
    background: #572828;
    box-shadow: 0 0 18px rgba(239, 111, 108, 0.42);
  }

  .path-node.writeback {
    border-color: var(--purple);
    background: #372451;
    box-shadow: 0 0 18px rgba(187, 134, 252, 0.42);
  }

  .path-arrow {
    color: #496982;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    transition:
      color 0.2s,
      text-shadow 0.2s;
  }

  .path-arrow.active {
    color: var(--yellow);
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.8);
  }

  /* ============ Cache 表：字放大 + 允许横向滚动 ============ */
  .table-wrap {
    overflow: auto;
    border: 1px solid #315574;
    border-radius: 7px;
  }

  table {
    width: auto;
    min-width: 1280px;
    border-collapse: collapse;
    font-size: var(--fs-label);
  }


  th,
  td {
    padding: 5px 6px;
    text-align: center;
    border: 1px solid #294661;
  }

  th {
    color: #b9dcff;
    background: #123452;
  }

  td {
    background: #091a2b;
  }

  tr.invalid-row td {
    color: #6f8295;
  }

  tr.dirty-row td {
    background: rgba(97, 77, 25, 0.58);
  }

  tr.active-row td {
    border-top-color: var(--yellow);
    border-bottom-color: var(--yellow);
  }

  td.active-word {
    background: #5d4a18 !important;
    box-shadow: inset 0 0 0 1px var(--yellow);
  }

  td.hit-word {
    background: #18543a !important;
    box-shadow: inset 0 0 0 1px var(--green);
  }

  .word-address,
  .word-value {
    display: block;
    white-space: nowrap;
    font-family: Consolas, monospace;
  }

  .word-address {
    color: var(--muted);
    font-size: 11px;
  }

  .word-value {
    margin-top: 2px;
    color: #a9d9ff;
    font-size: 12px;
  }

  /* ========== Memory Line / 最近 8 笔 DDR 事务 ========== */

  .memory-grid,
  .recent-grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(88px, max-content));
    justify-content: space-between;
    gap: 4px;
  }

  .memory-word,
  .recent-word {
    padding: 5px 3px;
    overflow: hidden;
    text-align: center;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #071827;
  }

  .memory-word {
    min-height: 58px;
  }

  .recent-word {
    min-height: 72px;
  }

  .memory-word small,
  .memory-word strong,
  .memory-word code,
  .recent-word small,
  .recent-word strong,
  .recent-word code,
  .recent-word span {
    display: block;
    margin: 1px 0;
    line-height: 1.25;
  }

  .memory-word small,
  .recent-word small {
    color: var(--muted);
    font-size: 11px;
  }

  .memory-word strong,
  .memory-word code,
  .recent-word strong,
  .recent-word code {
    font-family: Consolas, monospace;
    font-size: 12px;
  }

  .memory-word strong,
  .recent-word strong {
    color: #91cfff;
  }

  .memory-word code,
  .recent-word code {
    color: #d4e8ff;
  }

  .recent-word span {
    overflow: hidden;
    color: var(--muted);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .recent-word.read {
    border-color: #3c9167;
    background: rgba(20, 67, 49, 0.75);
  }

  .recent-word.write {
    border-color: #c69a2e;
    background: rgba(89, 71, 25, 0.78);
  }

  .memory-word.current-memory-word {
    border-color: var(--yellow);
    background: #5d4a18;
    box-shadow: 0 0 10px rgba(255, 209, 102, 0.35);
  }

  /* ================= 动画事务日志 ================= */
  .event-log {
    flex: 1 1 auto;
    min-height: 200px;
    padding: 8px;
    overflow: auto;
    color: #b9dcff;
    font-family: Consolas, monospace;
    font-size: var(--fs-label);
    line-height: 1.55;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #06131f;
  }

  .log-hit {
    color: var(--green);
  }

  .log-miss {
    color: var(--red);
  }

  .log-write {
    color: var(--yellow);
  }

  .log-info {
    color: #8ecbff;
  }

  footer {
    padding: 8px;
    color: var(--muted);
    text-align: center;
    font-size: 11px;
  }

  /* ====== V0.2 当前事务状态 + 8-Word Line Fill Buffer ====== */
  .transaction-layout {
    display: grid;
    grid-template-columns:
      minmax(430px, 0.95fr)
      minmax(560px, 1.05fr);
    gap: 8px;
    margin-top: 8px;
  }

  .transaction-status,
  .fill-buffer-panel {
    padding: 8px;
    border: 1px solid #315574;
    border-radius: 7px;
    background: #071827;
  }

  .transaction-status h3,
  .fill-buffer-panel h3 {
    margin: 0 0 6px;
    color: #b9dcff;
    font-size: 13px;
  }

  .transaction-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(104px, max-content));
    justify-content: space-between;
    gap: 4px;
  }


  .transaction-item {
    min-height: 42px;
    padding: 4px;
    overflow: hidden;
    text-align: center;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #091a2b;
  }

  .transaction-item small,
  .transaction-item strong {
    display: block;
  }

  .transaction-item small {
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.2;
  }

  /* 取消 nowrap / ellipsis，改为允许换行，放大后不再被截断 */
  .transaction-item strong {
    color: var(--yellow);
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.25;
    word-break: break-all;
  }

  .fill-buffer-grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(88px, max-content));
    justify-content: space-between;
    gap: 4px;
  }


  .fill-buffer-word {
    min-height: 74px;
    padding: 4px 3px;
    overflow: hidden;
    text-align: center;
    border: 1px solid #315574;
    border-radius: 6px;
    background: #091a2b;
    transition:
      border-color 0.2s,
      background 0.2s,
      box-shadow 0.2s;
  }

  .fill-buffer-word small,
  .fill-buffer-word strong,
  .fill-buffer-word code,
  .fill-buffer-word span {
    display: block;
    margin: 2px 0;
    line-height: 1.2;
  }

  .fill-buffer-word small {
    color: var(--muted);
    font-size: 11px;
  }

  .fill-buffer-word strong,
  .fill-buffer-word code {
    font-family: Consolas, monospace;
    font-size: 12px;
  }

  .fill-buffer-word strong {
    color: #91cfff;
  }

  .fill-buffer-word code {
    color: #d4e8ff;
  }

  .fill-buffer-word span {
    color: #657b8e;
    font-size: 11px;
  }

  .fill-buffer-word.valid {
    border-color: #3c9167;
    background: rgba(20, 67, 49, 0.75);
  }

  .fill-buffer-word.current {
    border-color: var(--yellow);
    background: #5d4a18;
    box-shadow: 0 0 12px rgba(255, 209, 102, 0.38);
  }

  .fill-buffer-word.last {
    box-shadow:
      inset 0 0 0 1px var(--purple),
      0 0 12px rgba(187, 134, 252, 0.35);
  }

  .transaction-read {
    color: var(--green) !important;
  }

  .transaction-write {
    color: var(--yellow) !important;
  }

  .transaction-idle {
    color: var(--muted) !important;
  }

  /* ==================== 响应式（统一为 3 档） ==================== */
  /* ==================== 响应式 ==================== */
  /* 宽屏：条目贴合文字；窄屏：切回 1fr 填满，避免横向溢出 */
  @media (max-width: 1760px) {
    .stat-grid {
      grid-template-columns: repeat(5, 1fr);
    }
  }

  @media (max-width: 1100px) {
    .data-path {
      grid-template-columns: 1fr;
    }

    .path-arrow {
      transform: rotate(90deg);
    }

    .transaction-layout {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 900px) {
    .header-main {
      align-items: flex-start;
      flex-direction: column;
    }

    .grid2 {
      grid-template-columns: 1fr;
    }

    .control-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .decode-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .stat-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .transaction-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .fill-buffer-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .memory-grid,
    .recent-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  /* ============ V0.2 微调：条目最大宽度封顶（防长文本撑爆整行） ============ */
  .stat,
  .decode-item {
    max-width: 168px;
  }

  .transaction-item {
    max-width: 200px;
  }

  .fill-buffer-word,
  .memory-word {
    max-width: 140px;
  }

  .recent-word {
    max-width: 150px;
  }
  /* ============ V0.2 微调：超宽屏字号抬档 ============ */
  @media (min-width: 2400px) {
    :root {
      --fs-label: 13px;
      --fs-data: 15px;
    }

    .stat strong {
      font-size: 18px;
    }

    .decode-item strong {
      font-size: 16px;
    }

    .transaction-item small,
    .fill-buffer-word small,
    .memory-word small,
    .recent-word small {
      font-size: 12px;
    }

    .transaction-item strong,
    .fill-buffer-word strong,
    .fill-buffer-word code,
    .memory-word strong,
    .memory-word code,
    .recent-word strong,
    .recent-word code {
      font-size: 13px;
    }
  }

</style>

</head>

<body>
  <header>
    <div class="header-main">
      <div class="header-title">
        <h1>KR4 CPU D-Cache 动画演示</h1>

        <span class="subtitle">
          8 KB · 64 Sets · 4 Ways · 32-byte Line · True LRU
        </span>
      </div>

      <div class="header-actions">
        <span class="badge">
          V0.2 · Owner: Jun Huang
        </span>

        <a class="header-link" href="./index.html">
          返回首页
        </a>

        <a class="header-link" href="./dcache.html">
          打开完整调试器
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" style="margin-bottom:8px;">
      <h2>1. 程序访问范围与运行控制</h2>

      <div class="control-grid">
        <label>
          起始地址
          <input
            id="startAddress"
            value="0x60000000"
          >
        </label>

        <label>
          终止地址
          <input
            id="endAddress"
            value="0x6000007C"
          >
        </label>

        <label>
          地址步进
          <select id="addressStep">
            <option value="4">4 Bytes</option>
            <option value="8">8 Bytes</option>
            <option value="16">16 Bytes</option>
            <option value="32">32 Bytes</option>
            <option value="64">64 Bytes</option>
          </select>
        </label>

        <label>
          访问模式
          <select id="accessMode">
            <option value="read">连续 Read</option>
            <option value="write">连续 Write</option>
            <option value="mixed" selected>
              Read / Write交替
            </option>
          </select>
        </label>

        <label>
          Write Data起始值
          <input
            id="writeDataBase"
            value="0x12340000"
          >
        </label>

        <label>
          Write Hit策略
          <select id="writeHitPolicy">
            <option value="wb" selected>
              Write Back
            </option>
            <option value="wt">
              Write Through
            </option>
          </select>
        </label>

        <label>
          Write Miss策略
          <select id="writeMissPolicy">
            <option value="wa" selected>
              Write Allocate
            </option>
            <option value="nwa">
              Non-write-allocate
            </option>
          </select>
        </label>
      </div>

      <div class="button-row">
        <button
          id="startButton"
          class="success-button"
        >
          开始运行
        </button>

        <button id="pauseButton">
          暂停
        </button>

        <button id="continueButton">
          继续
        </button>

        <button
          id="stepButton"
          class="warning-button"
        >
          单步动画
        </button>

        <button
          id="restartButton"
          class="danger-button"
        >
          重新开始
        </button>

        <label style="min-width:145px;">
          动画速度
          <select id="speed">
